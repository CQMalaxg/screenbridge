name: macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build universal macOS packages
        run: npm run dist:mac
      - name: Upload DMG and ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: screenbridge-macos-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
