server {
    listen 80;
    server_name screenbridge.zahml.top;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/screenbridge/www;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name screenbridge.zahml.top;

    ssl_certificate /opt/screenbridge/letsencrypt/config/live/screenbridge.zahml.top/fullchain.pem;
    ssl_certificate_key /opt/screenbridge/letsencrypt/config/live/screenbridge.zahml.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ScreenBridgeTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    access_log off;
    error_log /www/wwwlogs/screenbridge-relay-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 1m;
    }
}
